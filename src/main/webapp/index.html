<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TVGuide</title>
    <style>
        body{
          margin:0;
          font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
          background:#0f172a;
          color:#e5e7eb;
          padding:28px;
        }
        .container{ max-width:860px; margin:0 auto; }
        .card{
          background:#111827;
          border:1px solid rgba(255,255,255,.08);
          border-radius:14px;
          padding:18px;
          box-shadow:0 10px 25px rgba(0,0,0,.25);
        }
        h1{ margin:0 0 6px; font-size:28px; }
        p{ margin:0 0 14px; color:#cbd5e1; line-height:1.5; }
        .grid{
          display:grid;
          grid-template-columns:repeat(2, minmax(0, 1fr));
          gap:10px;
          margin-top:10px;
        }
        a.btn{
          display:flex;
          justify-content:space-between;
          align-items:center;
          padding:12px 14px;
          border-radius:12px;
          text-decoration:none;
          color:#e5e7eb;
          border:1px solid rgba(255,255,255,.08);
          background:#0b1220;
        }
        a.btn:hover{
          border-color: rgba(99,102,241,.55);
          background:#0a1430;
        }
        .muted{
          margin-top:14px;
          font-size:13px;
          color:#94a3b8;
        }
        code{
          background: rgba(255,255,255,.06);
          border:1px solid rgba(255,255,255,.08);
          padding:2px 6px;
          border-radius:8px;
        }
        @media (max-width:700px){
          .grid{ grid-template-columns:1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>TVGuide</h1>
        <p>Веб-интерфейс для управления каналами, жанрами и программой передач.</p>

        <div class="grid">
            <a class="btn" href="./channels"><span>Каналы</span><span>→</span></a>
            <a class="btn" href="./genres"><span>Жанры</span><span>→</span></a>
            <a class="btn" href="./programs"><span>Передачи</span><span>→</span></a>
            <a class="btn" href="./hello"><span>/hello (проверка)</span><span>→</span></a>
        </div>

        <div class="muted">
            База приложения: <code>/tvguide/</code> (Tomcat)
        </div>
    </div>
</div>
</body>
</html>
